[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awe-agent-function"
version = "0.1.0"
description = "Agent-Friendly Function Framework — promote any Python function to an LLM-discoverable artifact via a single decorator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anonymous (NeurIPS submission)" }]
keywords = ["llm", "agent", "decorator", "function-registry", "discoverability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []          # core decorator + registry are pure Python

[project.optional-dependencies]
auto = []                  # auto-decoration of foreign packages, pure Python
dev = ["pytest>=7"]

[project.urls]
Documentation = "https://github.com/aristoteleo/awe-agent-function"
Source        = "https://github.com/aristoteleo/awe-agent-function"

[tool.setuptools]
packages = ["awe_agent_function"]
